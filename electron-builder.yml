  - "electron/node_modules/buffer-crc32/**/*"
  - "node_modules/compress-commons/**/*"
  - "electron/node_modules/compress-commons/**/*"
  - "node_modules/crc-32/**/*"
  - "electron/node_modules/crc-32/**/*"
  - "node_modules/crc32-stream/**/*"
  - "electron/node_modules/crc32-stream/**/*"
  - "node_modules/event-target-shim/**/*"
  - "electron/node_modules/event-target-shim/**/*"
  - "node_modules/events/**/*"
  - "electron/node_modules/events/**/*"
  - "node_modules/events-universal/**/*"
  - "electron/node_modules/events-universal/**/*"
  - "node_modules/fast-fifo/**/*"
  - "electron/node_modules/fast-fifo/**/*"
