# Electron Builder 配置
# 项目根目录: e:\print706
# 打包产物: release/
appId: com.FapiaoGO.app
productName: FapiaoGO
directories:
  output: release
  buildResources: resources

# 启用 asar — 保护源代码，减小文件数量
asar: true

# WINDOW-CONSOLE-1 构建修正：项目无原生模块（archiver/electron-updater 均为纯 JS），
# 跳过 @electron/rebuild 原生依赖重建，避免打包期 proper-lockfile 锁冲突（Lock file is already being held）。
npmRebuild: false

# SIZE-2 体积优化：Electron 自带 55 个 locales/*.pak 共 47MB。
# 应用面向中文用户，只保留简体中文 + 英文（英文作其他系统语言的回退），预计 -44MB。
# 注意：此配置由 electron-builder 官方支持，仅过滤 locales 目录，不影响主程序与 asar 内容。
electronLanguages:
  - zh-CN
  - en-US

# 打包进 app.asar 的文件
files:
  - "electron/**/*"
  # 主进程生产依赖（archiver / exceljs / electron-updater + 完整传递依赖）必须随包，
  # 否则 clean build 后压缩包导出等功能会丢失（R2-1-D P0-1）。
  # 包含 electron/node_modules（已 npm install --production），仅排除 dev-only 包。
  - "!electron/node_modules/electron/**/*"
  - "!electron/node_modules/electron-builder/**/*"
  - "!electron/node_modules/@electron/rebuild/**/*"
  - "!electron/node_modules/electron-rebuild/**/*"
  - "!electron/node_modules/typescript/**/*"
  # electron-updater 及其传递依赖（动态 require 的包）
  - "node_modules/electron-updater/**/*"
  - "node_modules/builder-util-runtime/**/*"
  - "node_modules/lazy-val/**/*"
  - "node_modules/semver/**/*"
  - "node_modules/tiny-typed-emitter/**/*"
  - "node_modules/fs-extra/**/*"
  - "node_modules/lodash.escaperegexp/**/*"
  - "node_modules/lodash.isequal/**/*"
  - "node_modules/js-yaml/**/*"
  # P0-1: archiver 完整传递依赖（压缩包导出功能依赖，否则 clean build 后 zip 导出运行时崩溃）。
  # electron-builder 自动依赖分析未包含 archiver 的传递依赖，必须显式声明（root + electron 双位置）。
  # 注意：exceljs 经取证确认在主进程/前端均无 import（.xlsx 由 Python 后端 openpyxl 生成），属死依赖，不纳入。
  - "node_modules/abort-controller/**/*"
  - "electron/node_modules/abort-controller/**/*"
  - "node_modules/archiver/**/*"
  - "electron/node_modules/archiver/**/*"
  - "electron/node_modules/archiver-utils/**/*"
  - "node_modules/async/**/*"
  - "electron/node_modules/async/**/*"
  - "node_modules/b4a/**/*"
  - "electron/node_modules/b4a/**/*"
  - "node_modules/balanced-match/**/*"
  - "electron/node_modules/balanced-match/**/*"
  - "node_modules/bare-events/**/*"
  - "electron/node_modules/bare-events/**/*"
  - "node_modules/bare-fs/**/*"
  - "electron/node_modules/bare-fs/**/*"
  - "node_modules/bare-os/**/*"
  - "electron/node_modules/bare-os/**/*"
  - "node_modules/bare-path/**/*"
  - "electron/node_modules/bare-path/**/*"
  - "node_modules/bare-stream/**/*"
  - "electron/node_modules/bare-stream/**/*"
  - "node_modules/bare-url/**/*"
  - "electron/node_modules/bare-url/**/*"
  - "node_modules/base64-js/**/*"
  - "electron/node_modules/base64-js/**/*"
  - "node_modules/brace-expansion/**/*"
  - "electron/node_modules/brace-expansion/**/*"
