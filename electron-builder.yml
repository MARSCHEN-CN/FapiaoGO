  - "electron/node_modules/zip-stream/**/*"
  # 前端构建产物（进入 asar）
  - "dist/**/*"
  # 排除已通过 extraResources 打包的大体积二进制资源（避免重复）
  - "!dist/cmaps/**/*"
  - "!dist/standard_fonts/**/*"
  - "!dist/wasm/**/*"

# 额外资源（放入 resources/，不进入 asar，可被 file:// 协议访问）
extraResources:
  # 后端 server.exe (PyInstaller onefile 产物，含 Flask + OCR + PDF/OFD)
  - from: backend/dist/server
    to: backend/server
    filter:
      - "**/*"
  # SumatraPDF 打印引擎
  - from: resources/sumatra
    to: sumatra
  # OCR 模型（SIZE-1D-1 删除：不再复制第二份到 resources/models。
  #  生产唯一模型源 = backend/server/_internal/models（PyInstaller datas，server.spec 打包；
  #  ocr_engine._resolve_model_dir frozen 0a 分支优先，release_r35 运行日志实证）。
  #  删除仅消除发布包重复副本；开发资源 resources/models 与 OCR 加载逻辑均未动。）
  # 应用图标（生产模式下 process.resourcesPath/icon.ico）
  - from: resources/icon.ico
    to: icon.ico
  # PDF.js 静态资源（必须在 asar 外，通过 file:// 协议加载）
  - from: frontend/public/cmaps
    to: cmaps
  - from: frontend/public/standard_fonts
    to: standard_fonts
  - from: frontend/public/wasm
    to: wasm
  # OFD 渲染字体（生产环境经 FAPAIAO_RESOURCE_PATH/fonts 读取，见 ofd_constants.py）
  - from: frontend/public/fonts
    to: fonts
  # R2-3: 独立 pdf_tool（ONEDIR：pdf_tool.exe + _internal/，与 server.exe 同构）。
  # R2-3-E 实证：onefile 的 _MEI 运行时解包/清理被锁 → 父进程不退出 → callPython 挂起；
  # onedir 无运行时解包，node-spawn close=0 正常。生产路径 resources/tools/pdf_tool/pdf_tool.exe 不变。
  - from: backend/dist/pdf_tool
    to: tools/pdf_tool

# Windows 打包配置
win:
  target:
    - nsis
    - zip
    - dir
  icon: resources/icon.ico
  # R4-P0-3: zip 无专属配置块，用 win.artifactName 控制绿色版命名 →
  # FapiaoGO-1.0.0-win-x64.zip（版本规范）。nsis 有自己的 artifactName（优先，不受影响）。
  artifactName: ${productName}-${version}-${os}-${arch}.${ext}

# R4-P0-3: 绿色版 Portable（ZIP）。zip 无专属顶层配置块；
# 默认 artifactName 模板即 ${productName}-${version}-${os}-${arch}.${ext}
# → FapiaoGO-1.0.0-win-x64.zip（与版本规范一致）。绿色版不进 latest.yml 主链（updater 只认 nsis）。

# NSIS 安装程序配置
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: "FapiaoGO"
  perMachine: false
  differentialPackage: true
  # R4-B1: 固定产物命名（连字符），保证 产物文件名 == latest.yml path == GitHub Release asset 三者一致。
  # 此前默认 `<productName> Setup <version>.exe`（空格）与 latest.yml 的连字符形式不一致 → 更新下载 404。
  artifactName: ${productName}-Setup-${version}.${ext}

# 自动更新配置（R4-B2: 恢复 provider；构建阶段不带 --publish 即不会上传，latest.yml 照常生成）
publish:
  provider: github
  owner: MARSCHEN-CN
  repo: FapiaoGO
