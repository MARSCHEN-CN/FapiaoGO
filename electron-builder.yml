# Electron Builder 配置
appId: com.FapiaoGO.app
productName: FapiaoGO
directories:
  output: release
  buildResources: resources
files:
  - "electron/**/*"
  - "!electron/node_modules/**/*"
  # electron-updater 及其传递依赖（electron-builder 自动从 node_modules 复制 require() 的包，
  # 这里显式声明是为了确保动态 require() 的包也被包含）
  - "node_modules/electron-updater/**/*"
  - "node_modules/builder-util-runtime/**/*"
  - "node_modules/lazy-val/**/*"
  - "node_modules/semver/**/*"
  - "node_modules/tiny-typed-emitter/**/*"
  - "node_modules/fs-extra/**/*"
  - "node_modules/lodash.escaperegexp/**/*"
  - "node_modules/lodash.isequal/**/*"
  - "node_modules/js-yaml/**/*"
  - "dist/**/*"
# 打包时额外资源（SumatraPDF + Python 后端 + 脚本 + OCR 模型）
extraResources:
  - from: resources/sumatra
    to: sumatra
  - from: resources/models
    to: models
  - from: backend
    to: backend
    filter:
      - "**/*"
      - "!**/__pycache__/**"
      - "!**/*.pyc"
      - "!**/*.pyo"
      - "!**/.git/**"
      - "!**/tests/**"
      - "!**/test_*.py"
      - "!**/models/**"
  - from: pyscripts
    to: pyscripts
  - from: frontend/public/cmaps
    to: cmaps
  - from: frontend/public/standard_fonts
    to: standard_fonts
  - from: frontend/public/wasm
    to: wasm
# Windows 打包配置
win:
  target:
    - nsis
    - portable
  icon: resources/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

# 自动更新配置 — 发布到 GitHub Releases
#   打包时生成 NSIS 安装包 + latest.yml 元数据。
#   electron-updater 在运行时通过 GitHub API 检查和下载更新。
#   不同渠道通过不同 owner/repo 或不同 tag 区分。
publish:
  provider: github
  owner: MARSCHEN-CN
  repo: FapiaoGO
