  - "electron/node_modules/readdir-glob/**/*"
  - "node_modules/safe-buffer/**/*"
  - "electron/node_modules/safe-buffer/**/*"
  - "node_modules/streamx/**/*"
  - "electron/node_modules/streamx/**/*"
  - "node_modules/string_decoder/**/*"
  - "electron/node_modules/string_decoder/**/*"
  - "node_modules/tar-stream/**/*"
  - "electron/node_modules/tar-stream/**/*"
  - "node_modules/teex/**/*"
  - "electron/node_modules/teex/**/*"
